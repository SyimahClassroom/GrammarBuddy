<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grammar Buddy — Simple Present &amp; Simple Past</title>
  <style>
    :root {
      --bg-page: #dff2fe;
      --bg-card: rgba(255, 255, 255, 0.95);
      --ink-main: #0f172a;
      --ink-muted: #475569;
      --border-soft: #bae6fd;
      --radius-lg: 20px;
      --radius-md: 12px;
      --shadow-card: 0 8px 24px rgba(14, 116, 144, 0.1);
      --blue: #0ea5e9;
      --blue-dark: #0284c7;
      --blue-soft: #e0f2fe;
      --orange: #f97316;
      --orange-dark: #ea580c;
      --orange-soft: #ffedd5;
      --green: #16a34a;
      --green-dark: #15803d;
      --green-soft: #dcfce7;
      --purple: #8b5cf6;
      --purple-dark: #6d28d9;
      --purple-soft: #ede9fe;
      --pink: #ec4899;
      --pink-dark: #be185d;
      --pink-soft: #fce7f3;
      --cyan: #0891b2;
      --cyan-dark: #0e7490;
      --cyan-soft: #cffafe;
      --red: #ef4444;
    }

    * { box-sizing: border-box; }

    @keyframes cloudDriftSlow {
      0% { transform: translateX(-18vw); }
      100% { transform: translateX(118vw); }
    }
    @keyframes cloudDriftMedium {
      0% { transform: translateX(-25vw); }
      100% { transform: translateX(120vw); }
    }
    @keyframes buddyRobotMove {
      0% { transform: translateY(0px) rotate(-5deg) scale(1); }
      25% { transform: translateY(-5px) translateX(2px) rotate(5deg) scale(1.05); }
      50% { transform: translateY(1px) translateX(0px) rotate(-3deg) scale(1); }
      75% { transform: translateY(-5px) translateX(-2px) rotate(6deg) scale(1.05); }
      100% { transform: translateY(0px) rotate(-5deg) scale(1); }
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #7dd3fc 0%, #bae6fd 34%, #e0f2fe 72%, #f0f9ff 100%);
      background-attachment: fixed;
      color: var(--ink-main);
      line-height: 1.5;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    .sky-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .sky-cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.72);
      border-radius: 999px;
      filter: blur(0.4px);
      box-shadow: 0 8px 20px rgba(255, 255, 255, 0.45);
    }
    .sky-cloud::before,
    .sky-cloud::after {
      content: "";
      position: absolute;
      background: rgba(255, 255, 255, 0.78);
      border-radius: 50%;
    }
    .cloud-1 {
      width: 150px;
      height: 46px;
      top: 11%;
      animation: cloudDriftSlow 48s linear infinite;
    }
    .cloud-1::before { width: 68px; height: 68px; top: -30px; left: 20px; }
    .cloud-1::after { width: 52px; height: 52px; top: -20px; right: 22px; }

    .cloud-2 {
      width: 190px;
      height: 54px;
      top: 26%;
      left: 0;
      animation: cloudDriftMedium 62s linear infinite;
      animation-delay: -18s;
      opacity: 0.85;
    }
    .cloud-2::before { width: 82px; height: 82px; top: -36px; left: 28px; }
    .cloud-2::after { width: 64px; height: 64px; top: -24px; right: 26px; }

    .cloud-3 {
      width: 130px;
      height: 40px;
      top: 58%;
      left: 0;
      animation: cloudDriftSlow 56s linear infinite;
      animation-delay: -32s;
      opacity: 0.7;
    }
    .cloud-3::before { width: 56px; height: 56px; top: -24px; left: 18px; }
    .cloud-3::after { width: 44px; height: 44px; top: -16px; right: 18px; }

    a { color: inherit; }
    button, input, select, textarea { font-family: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1.5px solid #bae6fd;
    }
    .topbar-inner {
      max-width: 1140px;
      margin: 0 auto;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand-font { font-weight: 900; letter-spacing: -0.02em; }
    .brand-link {
      display: inline-flex; align-items: center; gap: 8px;
      text-decoration: none; font-size: 1.25rem; color: #0f172a;
    }
    .brand-mascot {
      width: 38px; height: 38px; border-radius: 12px; background: #fef08a;
      border: 2px solid #facc15; display: grid; place-items: center; font-size: 1.25rem;
    }
    .home-link, .nav-btn {
      min-height: 40px; padding: 7px 14px; border-radius: 999px;
      border: 1.5px solid #cbd5e1; background: #ffffff; color: var(--ink-main);
      font-weight: 700; font-size: 0.92rem; text-decoration: none;
      display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    }
    .home-link:hover, .nav-btn:hover { background: #f1f5f9; }
    .nav-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .streak-pill {
      background: #ffedd5; border: 1.5px solid #fdba74; color: #9a3412;
      font-weight: 800; font-size: 0.85rem; padding: 6px 12px; border-radius: 999px;
    }
    .ask-buddy-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .moving-buddy-bot {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #e0f2fe 0%, #fef08a 100%);
      border: 2px solid #38bdf8;
      display: inline-grid;
      place-items: center;
      font-size: 1.25rem;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.22);
      animation: buddyRobotMove 2.2s ease-in-out infinite;
    }
    .ask-buddy-trigger { background: #ede9fe; border-color: #c4b5fd; color: #4c1d95; }
    .ask-buddy-trigger:hover { background: #ddd6fe; }

    .main-container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 24px 18px 56px;
      position: relative;
      z-index: 1;
    }
    .hero-banner {
      background: linear-gradient(135deg, rgba(224, 242, 254, 0.96) 0%, rgba(240, 249, 255, 0.95) 55%, rgba(254, 249, 195, 0.92) 100%);
      border: 2px solid #7dd3fc;
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-card);
    }
    .hero-title { margin: 0; font-size: clamp(2rem, 4vw, 2.8rem); color: #0f172a; }
    .hero-subtitle { margin: 6px 0 0; font-size: 1.12rem; color: #0369a1; font-weight: 800; }
    .hero-desc { margin: 8px 0 0; font-size: 1rem; color: var(--ink-muted); font-weight: 500; }

    .feature-grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
    @media (min-width: 640px) { .feature-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 960px) { .feature-grid { grid-template-columns: repeat(3, 1fr); } }

    .feature-card {
      background: var(--bg-card); border-radius: var(--radius-lg); padding: 22px;
      border: 1.5px solid var(--border-soft); box-shadow: var(--shadow-card);
      display: flex; flex-direction: column; justify-content: space-between; gap: 14px;
      text-decoration: none; color: inherit; transition: transform 0.16s ease, box-shadow 0.16s ease;
      position: relative; overflow: hidden;
    }
    .feature-card::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 7px;
      background: var(--accent, var(--blue));
    }
    .feature-card:hover { transform: translateY(-3px); box-shadow: 0 14px 28px rgba(15, 23, 42, 0.12); }
    .card-icon-badge {
      width: 52px; height: 52px; border-radius: 16px;
      background: var(--accent-soft, var(--blue-soft)); color: var(--accent, var(--blue));
      display: grid; place-items: center; font-size: 1.5rem; font-weight: 700;
    }
    .card-title { margin: 0; font-size: 1.3rem; }
    .card-desc { margin: 4px 0 0; color: var(--ink-muted); font-size: 0.96rem; line-height: 1.45; }
    .card-cta { font-weight: 800; font-size: 0.92rem; color: var(--accent-dark, var(--blue-dark)); }

    .tool-shell {
      background: var(--bg-card); border-radius: var(--radius-lg); padding: 24px;
      border: 1.5px solid var(--border-soft); box-shadow: var(--shadow-card);
    }
    .tool-header { margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid #e2e8f0; }
    .tool-header h2 { margin: 0; font-size: 1.75rem; }
    .tool-header p { margin: 6px 0 0; color: var(--ink-muted); font-size: 1rem; }

    .translate-dir-bar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
      background: #f1f5f9; border: 1.5px solid #cbd5e1; border-radius: var(--radius-md);
      padding: 10px 14px; margin-bottom: 14px;
    }
    .lang-pill { background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 0.9rem; }

    .field-group { margin-bottom: 16px; }
    .field-label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 0.98rem; }
    .input-control, .select-control, .textarea-control {
      width: 100%; padding: 12px 14px; border-radius: var(--radius-md);
      border: 2px solid #cbd5e1; font-size: 1rem; background: #ffffff; color: var(--ink-main);
    }
    .textarea-control { min-height: 120px; resize: vertical; }

    .primary-btn {
      min-height: 46px; padding: 10px 20px; border: none; border-radius: var(--radius-md);
      font-weight: 800; font-size: 0.98rem; color: #ffffff; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 0 rgba(15, 23, 42, 0.16); transition: transform 0.12s ease;
    }
    .primary-btn:active:not(:disabled) { transform: translateY(2px); }
    .primary-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-blue { background: var(--blue); }
    .btn-blue:hover:not(:disabled) { background: var(--blue-dark); }
    .btn-orange { background: var(--orange); }
    .btn-orange:hover:not(:disabled) { background: var(--orange-dark); }
    .btn-green { background: var(--green); }
    .btn-green:hover:not(:disabled) { background: var(--green-dark); }
    .btn-red { background: var(--red); }
    .btn-red:hover:not(:disabled) { background: #dc2626; }

    .secondary-btn {
      min-height: 40px; padding: 7px 14px; border-radius: var(--radius-md);
      border: 1.5px solid #cbd5e1; background: #f8fafc; color: var(--ink-main);
      font-weight: 700; font-size: 0.9rem; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .secondary-btn:hover:not(:disabled) { background: #e2e8f0; }

    .chip-btn {
      border: 1.5px solid #93c5fd; background: #eff6ff; color: #1e3a8a;
      border-radius: 999px; padding: 6px 12px; font-size: 0.85rem; font-weight: 700; cursor: pointer;
    }
    .chip-btn:hover { background: #dbeafe; }

    .status-banner {
      margin-top: 14px; padding: 12px 14px; border-radius: var(--radius-md);
      font-weight: 700; font-size: 0.95rem; border: 1.5px solid transparent;
    }
    .status-info { background: #eff6ff; border-color: #bfdbfe; color: #1e40af; }
    .status-warn { background: #fef3c7; border-color: #fde68a; color: #92400e; }
    .status-error { background: #fee2e2; border-color: #fecaca; color: #991b1b; }
    .status-ok { background: #dcfce7; border-color: #bbf7d0; color: #166534; }

    .buddy-bubble-wrap { display: flex; align-items: flex-start; gap: 14px; margin-top: 18px; }
    .buddy-avatar {
      width: 52px; height: 52px; border-radius: 16px; background: #facc15;
      border: 2px solid #eab308; display: grid; place-items: center; font-size: 1.6rem; flex-shrink: 0;
    }
    .buddy-bubble {
      flex: 1; background: #ffffff; border: 2px solid #e2e8f0;
      border-radius: 18px; padding: 16px 18px; box-shadow: 0 6px 18px rgba(15, 23, 42, 0.05);
    }
    .buddy-bubble-title { margin: 0 0 8px; font-size: 1.12rem; font-weight: 800; }
    .dashed-highlight {
      display: inline-block; background: #fef9c3; border: 2px dashed #eab308;
      padding: 6px 12px; border-radius: 10px; font-weight: 800; font-size: 1.05rem; margin: 6px 0;
    }
    .mark-changed { background: #fef08a; padding: 1px 6px; border-radius: 6px; font-weight: 800; }
    .dict-row { padding: 8px 0; border-bottom: 1px dashed #e2e8f0; }
    .dict-row:last-child { border-bottom: none; }

    .issue-card-wrong {
      background: #fef2f2; border: 2px solid #fecaca; border-radius: 16px; padding: 16px 18px; margin-top: 14px;
    }
    .issue-card-right {
      background: #f0fdf4; border: 2px solid #bbf7d0; border-radius: 16px; padding: 14px 16px; margin-top: 12px;
    }
    .wrong-word { background: #fee2e2; color: #991b1b; padding: 2px 7px; border-radius: 6px; font-weight: 800; border-bottom: 2px wavy #dc2626; }
    .right-word { background: #dcfce7; color: #166534; padding: 2px 7px; border-radius: 6px; font-weight: 800; }
    .why-list { margin: 8px 0 0; padding-left: 20px; color: #1e293b; font-size: 0.94rem; }
    .why-list li { margin-bottom: 4px; }

    /* Burger Madness */
    @keyframes popStack {
      0% { transform: translateY(-28px) scale(0.82); opacity: 0; }
      70% { transform: translateY(4px) scale(1.05); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.95); opacity: 1; }
      100% { transform: translateY(-28px) scale(1.06); opacity: 0; }
    }
    @keyframes bunnyHop {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-8px) rotate(3deg); }
    }
    @keyframes critterWiggle {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      25% { transform: translateX(-4px) rotate(-5deg); }
      75% { transform: translateX(4px) rotate(5deg); }
    }
    @keyframes sunnyPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.35); }
      50% { box-shadow: 0 0 0 8px rgba(249, 115, 22, 0); }
    }

    .bm-bright-world {
      background: linear-gradient(180deg, #fffbeb 0%, #fef3c7 48%, #e0f2fe 100%);
      color: #0f172a;
      border: 3px solid #fb923c;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 14px 34px rgba(249, 115, 22, 0.14);
      position: relative;
      overflow: hidden;
    }
    .bm-hud-bar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
      background: #ffffff;
      border: 2px solid #fed7aa;
      border-radius: 18px; padding: 12px 16px; margin-bottom: 14px;
    }
    .bm-pill {
      background: #fff7ed; border: 1.5px solid #fdba74; color: #9a3412;
      border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 0.88rem;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .bm-pill.gold { background: #fef9c3; border-color: #facc15; color: #854d0e; }
    .bm-pill.hp { background: #fee2e2; border-color: #fca5a5; color: #991b1b; }
    .bm-pill.streak { background: #e0f2fe; border-color: #7dd3fc; color: #075985; }
    .bm-pill.rank { background: #fce7f3; border-color: #f9a8d4; color: #9d174d; }

    .bm-map-strip {
      background: linear-gradient(90deg, #dcfce7 0%, #fef9c3 50%, #ffedd5 100%);
      border: 2px solid #86efac;
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .bm-map-nodes {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }
    @media (min-width: 760px) {
      .bm-map-nodes { grid-template-columns: repeat(4, 1fr); }
    }
    .bm-mission-node {
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 16px;
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .bm-mission-node:hover { transform: translateY(-2px); border-color: #fb923c; }
    .bm-mission-node.active {
      background: #fff7ed;
      border-color: #ea580c;
      box-shadow: 0 6px 16px rgba(234, 88, 12, 0.16);
    }
    .bm-mission-node.cleared {
      background: #f0fdf4;
      border-color: #22c55e;
    }

    .bm-stage-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 920px) {
      .bm-stage-grid { grid-template-columns: 230px 1fr 225px; align-items: start; }
    }
    .bm-card {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #fed7aa;
      border-radius: 20px;
      padding: 16px;
      position: relative;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.05);
    }

    .bm-character-stage {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: linear-gradient(135deg, #e0f2fe 0%, #fef9c3 100%);
      border: 2px solid #bae6fd;
      border-radius: 16px;
      padding: 10px 14px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .bm-chef-bunny {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 0.9rem;
      color: #0f172a;
      animation: bunnyHop 1.8s ease-in-out infinite;
    }
    .bm-critter-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 1.35rem;
    }
    .bm-critter {
      display: inline-block;
      animation: critterWiggle 2.1s ease-in-out infinite;
    }
    .bm-critter:nth-child(2) { animation-delay: 0.3s; }
    .bm-critter:nth-child(3) { animation-delay: 0.6s; }
    .bm-critter:nth-child(4) { animation-delay: 0.9s; }

    .bm-order-ticket {
      background: #fffbeb;
      border: 2.5px dashed #f97316;
      border-radius: 16px;
      padding: 18px;
      margin: 12px 0;
      font-size: 1.16rem;
      font-weight: 700;
      color: #0f172a;
      animation: sunnyPulse 2.4s infinite;
    }
    .bm-verb-pill {
      background: #fde047;
      color: #0f172a;
      border: 1.5px solid #eab308;
      padding: 2px 9px;
      border-radius: 8px;
      font-weight: 900;
    }
    .bm-float-badge {
      position: absolute; top: 12px; right: 14px; font-weight: 900; font-size: 0.98rem;
      color: #15803d; background: #dcfce7; border: 1.5px solid #86efac;
      padding: 3px 10px; border-radius: 999px;
      pointer-events: none; animation: floatUp 0.95s ease forwards;
    }
    .bm-float-badge.bad { color: #991b1b; background: #fee2e2; border-color: #fca5a5; }

    .burger-stack-bright {
      display: flex; flex-direction: column-reverse; align-items: center; gap: 6px;
      min-height: 210px; justify-content: flex-start; padding: 12px 8px;
      background: #fffbeb; border-radius: 16px; border: 2px dashed #fbbf24;
    }
    .burger-layer-anim {
      width: 100%; max-width: 185px; padding: 7px 10px; border-radius: 12px;
      font-weight: 800; font-size: 0.86rem; text-align: center;
      animation: popStack 0.36s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.08);
    }

    /* Tense Showdown — Head-Tilt Camera Arena */
    .arcade-shell {
      background: #091326; color: #f8fafc; border: 2px solid #22d3ee;
      border-radius: var(--radius-lg); padding: 20px; box-shadow: 0 12px 32px rgba(2, 6, 23, 0.45);
    }
    .arcade-top {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
      border-bottom: 1px solid rgba(34, 211, 238, 0.35); padding-bottom: 12px; margin-bottom: 14px;
    }
    .arcade-title { margin: 0; color: #22d3ee; font-size: 1.5rem; }
    .arcade-hud-badge {
      background: rgba(245, 158, 11, 0.18); border: 1.5px solid #fbbf24; color: #fde68a;
      font-weight: 800; padding: 6px 12px; border-radius: 999px; font-size: 0.9rem;
    }
    .level-selector-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
    .showdown-lvl-btn {
      padding: 8px 13px; border-radius: 999px; border: 1.5px solid rgba(34, 211, 238, 0.5);
      background: #10203d; color: #cbd5e1; font-weight: 800; font-size: 0.86rem; cursor: pointer;
    }
    .showdown-lvl-btn.active { background: #22d3ee; color: #091326; border-color: #22d3ee; }

    .tilt-stage {
      display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 14px;
    }
    @media (min-width: 780px) {
      .tilt-stage { grid-template-columns: 1fr 290px 1fr; align-items: stretch; }
    }
    .tilt-zone {
      border-radius: 18px; padding: 14px; text-align: center; border: 2px dashed rgba(34, 211, 238, 0.45);
      background: rgba(16, 32, 61, 0.75); display: flex; flex-direction: column; justify-content: center; gap: 6px;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
    }
    .tilt-zone.active-left {

      function escapeHtml(str) {
        return String(str ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function highlightPhrase(fullText, targetPhrase, highlightClass) {
        const safeFull = escapeHtml(fullText);
        if (!targetPhrase) return safeFull;
        const idx = fullText.toLowerCase().indexOf(targetPhrase.toLowerCase());
        if (idx === -1) return safeFull;
        return `${escapeHtml(fullText.slice(0, idx))}<span class="${highlightClass}">${escapeHtml(fullText.slice(idx, idx + targetPhrase.length))}</span>${escapeHtml(fullText.slice(idx + targetPhrase.length))}`;
      }

      function highlightMultiple(fullText, phrases, highlightClass) {
        let html = escapeHtml(fullText);
        const list = (phrases || []).filter(Boolean).sort((a, b) => b.length - a.length);
        list.forEach((p) => {
          const esc = p.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          html = html.replace(new RegExp(esc, "gi"), (match) => `<span class="${highlightClass}">${match}</span>`);
        });
        return html;
      }

      function setStatus(el, msg, type = "info") {
        if (!el) return;

      const verbsByAnyForm = new Map();
      const enToMsExact = new Map();
      const msToEnExact = new Map();

      function addMapEntry(map, key, val) {
        const k = key.toLowerCase().trim();
        if (!k) return;
        if (!map.has(k)) map.set(k, []);
        if (!map.get(k).some((x) => x.label === val.label)) map.get(k).push(val);
      }

            const clean = part.trim().toLowerCase();
            if (!clean) return;
            if (!verbsByAnyForm.has(clean)) verbsByAnyForm.set(clean, []);
            if (!verbsByAnyForm.get(clean).some((x) => x.id === v.id)) verbsByAnyForm.get(clean).push(v);
            addMapEntry(enToMsExact, clean, { label: v.meaningMs, note: `Verb “${v.base}” • Past: ${v.past}` });
          });
        });
        v.meaningMs.split(/[\/,]/).forEach((msPart) => {
          const cleanMs = msPart.trim();
          if (cleanMs) addMapEntry(msToEnExact, cleanMs, { label: `${v.base} (he/she/it: ${v.thirdPerson} | past: ${v.past})`, note: v.definition });
        });
      });

        function buildHighContrastCanvas(imgEl) {
          const maxW = 1400;
          const scale = imgEl.naturalWidth > maxW ? maxW / imgEl.naturalWidth : 1;
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(imgEl.naturalWidth * scale));
          canvas.height = Math.max(1, Math.round(imgEl.naturalHeight * scale));
          const ctx = canvas.getContext("2d", { willReadFrequently: true });
          ctx.drawImage(imgEl, 0, 0, canvas.width, canvas.height);

          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const d = imgData.data;
          for (let i = 0; i < d.length; i += 4) {
            const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
            const boosted = gray < 150 ? Math.max(0, gray * 0.45) : Math.min(255, gray * 1.18);
            d[i] = boosted;
            d[i + 1] = boosted;
            d[i + 2] = boosted;
          }
          ctx.putImageData(imgData, 0, 0);
          return canvas;
        }

        function reviewAndPolishText(text) {
          const normalized = normalizeOcrText(text, fileInput.files && fileInput.files[0] ? fileInput.files[0].name : "");

                    'Spelling & Sequence: "The," → "Then,", and "yummy foods" → "delicious food".',
                    'Subject–Verb Agreement: "My mother" takes "cooks"; "I" takes "go" and "love" (not "I goes" or "I loves").',
                    'Daily Routine Polish: Added "at 6.00 a.m.", "breakfast with my family", "by car", "English and Mathematics", "play with my friends during recess", "do my homework and watch television", and "have dinner with my family before going to bed".'
                  ]
                }
              ],
              sentenceCount: 11
            };
          }

          const rawSentences = normalized.split(/(?<=[.!?])\s+/).filter(Boolean);

          const pastMarkers = /\b(yesterday|last week|last night|last saturday|last sunday|last month|last year|two years ago|during our last trip|when i was younger|ago)\b/i;
          const presentHabitMarkers = /\b(every day|every morning|every night|every week|every sunday|every friday|almost every day|today|usually|always|often|at school|after school|at night)\b/i;

          const singularNouns = new Set([
            "he", "she", "it", "technology", "plastic pollution", "pollution", "everyone", "everybody", "someone", "somebody",
            "aina", "ali", "adam", "mother", "my mother", "mama", "brother", "sister", "teacher", "pupil", "baby", "cat", "dog", "bus", "school"
          ]);
          const pluralNouns = new Set([
            "they", "we", "you", "i", "teachers", "pupils", "students", "people", "many people", "my parents", "parents",
            "my brother and i", "friends", "my friends", "boys", "girls", "birds"
          ]);

          const verbPairs = [
            { base: "walk", sing: "walks", past: "walked" },
            { base: "wake up", sing: "wakes up", past: "woke up" },
            { base: "wake", sing: "wakes", past: "woke" },
            { base: "see", sing: "sees", past: "saw" },
            { base: "have", sing: "has", past: "had" },
            { base: "use", sing: "uses", past: "used" },
            { base: "introduce", sing: "introduces", past: "introduced" },
            { base: "provide", sing: "provides", past: "provided" },
            { base: "skip", sing: "skips", past: "skipped" },
            { base: "eat", sing: "eats", past: "ate" },
            { base: "allow", sing: "allows", past: "allowed" },
            { base: "love", sing: "loves", past: "loved" },
            { base: "visit", sing: "visits", past: "visited" },
            { base: "are", sing: "is", past: "were" },
            { base: "is", sing: "is", past: "was" },
            { base: "reduce", sing: "reduces", past: "reduced" },
            { base: "organize", sing: "organizes", past: "organized" },
            { base: "go", sing: "goes", past: "went" },
            { base: "study", sing: "studies", past: "studied" },
            { base: "play", sing: "plays", past: "played" },
            { base: "cook", sing: "cooks", past: "cooked" }
          ];

          const findings = [];
          const correctedSentences = rawSentences.map((sent) => {
            let corrected = normalizeOcrText(sent, "");
            const wrongMarks = [];
            const rightMarks = [];
            const whys = [];
            const hasPast = pastMarkers.test(corrected);
            const hasPresentHabit = presentHabitMarkers.test(corrected);

            if (/^[a-z]/.test(corrected)) {
              corrected = corrected.charAt(0).toUpperCase() + corrected.slice(1);
              whys.push("Capitalization: Start the sentence with a capital letter.");
            }

            if (/\bi\b/.test(corrected)) {
              corrected = corrected.replace(/\bi\b/g, "I");
              whys.push('Capitalization: Always write the pronoun "I" as a capital letter.');
            }

            const becauseMatch = corrected.match(/\b(Because\s+[^,]+?)\s+(we|they|he|she|I|it|people|students|teachers)\b/);
            if (becauseMatch) {
              wrongMarks.push(becauseMatch[0]);
              const fixedClause = `${becauseMatch[1]}, ${becauseMatch[2]}`;
              rightMarks.push(fixedClause);
              corrected = corrected.replace(becauseMatch[0], fixedClause);
              whys.push(`Comma: Add a comma after the introductory clause ("${becauseMatch[1]},").`);
            }

            if (/^However\s+(?!,)/.test(corrected)) {
              wrongMarks.push("However ");
              rightMarks.push("However, ");
              corrected = corrected.replace(/^However\s+/, "However, ");
              whys.push('Comma: Use a comma after "However," at the start of a sentence.');
            }

            const listMatch = corrected.match(/([A-Za-z0-9\s]+,\s+[A-Za-z0-9\s]+)\s+and\s+([A-Za-z0-9\s]+)/);
            if (listMatch) {
              wrongMarks.push(listMatch[0]);
              const fixedList = `${listMatch[1]}, and ${listMatch[2]}`;
              rightMarks.push(fixedList);
              corrected = corrected.replace(listMatch[0], fixedList);
              whys.push('Comma: Add a comma before "and" in a list of three or more items.');
            }

            verbPairs.forEach((vp) => {
              singularNouns.forEach((subj) => {
                if (vp.base !== vp.sing) {
                  const re = new RegExp(`\\b(${subj.replace(/\s+/g, "\\s+")})\\s+(${vp.base.replace(/\s+/g, "\\s+")})\\b`, "gi");
                  const m = corrected.match(re);
                  if (m) {
                    m.forEach((hit) => {
                      const parts = hit.split(/\s+/);
                      const verbPart = vp.base.includes(" ") ? vp.base : parts[parts.length - 1];
                      const fixedHit = hit.replace(new RegExp(`${verbPart.replace(/\s+/g, "\\s+")}$`, "i"), vp.sing);
                      wrongMarks.push(hit);
                      rightMarks.push(fixedHit);
                      corrected = corrected.replace(hit, fixedHit);
                      whys.push(`Subject–Verb Agreement: "${subj}" is singular, so use "${vp.sing}" (not "${verbPart}").`);
                    });
                  }
                }
              });

              pluralNouns.forEach((subj) => {
                if (vp.base !== vp.sing) {
                  const re = new RegExp(`\\b(${subj.replace(/\s+/g, "\\s+")})\\s+(${vp.sing.replace(/\s+/g, "\\s+")})\\b`, "gi");
                  const m = corrected.match(re);
                  if (m) {
                    m.forEach((hit) => {
                      const fixedHit = hit.replace(new RegExp(`${vp.sing.replace(/\s+/g, "\\s+")}$`, "i"), vp.base);
                      wrongMarks.push(hit);
                      rightMarks.push(fixedHit);
                      corrected = corrected.replace(hit, fixedHit);
                      whys.push(`Subject–Verb Agreement: With "${subj}", use "${vp.base}" (not "${vp.sing}").`);
                    });
                  }
                }
              });

              if (hasPast) {
                [vp.base, vp.sing].forEach((form) => {
                  const re = new RegExp(`\\b${form.replace(/\s+/g, "\\s+")}\\b`, "gi");
                  if (re.test(corrected) && !new RegExp(`\\b${vp.past.replace(/\s+/g, "\\s+")}\\b`, "i").test(corrected)) {
                    wrongMarks.push(form);
                    rightMarks.push(vp.past);
                    corrected = corrected.replace(re, vp.past);
                    whys.push(`Tense: Past time clue detected; use "${vp.past}".`);
                  }
                });
              } else if (hasPresentHabit && !hasPast) {
                const pastRe = new RegExp(`\\b${vp.past.replace(/\s+/g, "\\s+")}\\b`, "gi");
                if (pastRe.test(corrected)) {
                  wrongMarks.push(vp.past);
                  rightMarks.push(vp.base);
                  corrected = corrected.replace(pastRe, vp.base);
                  whys.push(`Tense: Present time clue detected; use "${vp.base}"/"${vp.sing}" instead of "${vp.past}".`);
                }
              }
            });

            if (whys.length > 0 || corrected !== sent) {
              findings.push({
                original: sent,
                corrected,
                wrongMarks: [...new Set(wrongMarks)],
                rightMarks: [...new Set(rightMarks)],
                whys: whys.length ? [...new Set(whys)] : ["Polished punctuation, spacing, or word form for clear standard English."]
              });
            }

            return corrected;
          });

          const fullCorrected = correctedSentences.join(" ");
          return { normalized, fullCorrected, findings, sentenceCount: rawSentences.length };
        }

        function runChecker() {
          const txt = ta.value.trim();
          out.innerHTML = "";
          if (!txt) {

                  </ul>

            `;
            setStatus(st, `Found ${activePreset.why.length} grammar/punctuation fix(es).`, "warn");
            return;
          }

          const { fullCorrected, findings, sentenceCount } = reviewAndPolishText(txt);

          if (!findings.length) {
            out.innerHTML = `

                <div style="font-weight:900;color:#166534;margin-bottom:6px;">✅ Correction:</div>

            </div>

          `;

          setStatus(st, `Scanned & checked ${sentenceCount} sentence(s) with corrections.`, "ok");

          function submitAnswer(chosenTense) {
            if (answered || finished) return;

            const ok = chosenTense === cur.tense;
            if (ok) score += 1;

            const fb = document.getElementById("tsFb");
            if (fb) {
              fb.innerHTML = `
                <div style="margin-top:12px;padding:12px;border-radius:12px;background:#091326;border:1px solid ${ok ? "#4ade80" : "#fbbf24"};">

                draw();
                if (tiltEnabled) startTiltLoop();
              });
            }
          }

          const pastBtn = document.getElementById("tsPastBtn");
          const presBtn = document.getElementById("tsPresentBtn");
          if (pastBtn) pastBtn.addEventListener("click", () => submitAnswer("past"));
          if (presBtn) presBtn.addEventListener("click", () => submitAnswer("present"));

          const keyHandler = (e) => {
            if (e.key === "ArrowLeft") submitAnswer("past");
            else if (e.key === "ArrowRight") submitAnswer("present");
          };
          window.addEventListener("keydown", keyHandler);

          async function enableCamera() {
            const camSt = document.getElementById("tsCamStatus");
            try {
              stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user", width: { ideal: 320 }, height: { ideal: 240 } },
                audio: false
              });
              const vid = document.getElementById("tsVideo");
              if (vid) {
                vid.srcObject = stream;
                await vid.play();
              }
              tiltEnabled = true;
              prevFrame = null;
              smoothedDeg = 0;
              if (camSt) camSt.textContent = "Tilt Left = Past | Right = Present";
              startTiltLoop();
            } catch (_err) {
              tiltEnabled = false;
              if (camSt) camSt.textContent = "Cam blocked — use buttons/arrows";
            }
          }

          function stopCamera() {
            tiltEnabled = false;
            if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
            if (stream) { stream.getTracks().forEach((tr) => tr.stop()); stream = null; }
            const camSt = document.getElementById("tsCamStatus");
            if (camSt) camSt.textContent = "Camera Off";
          }

          function isSkinLike(r, g, b) {
            return (
              r > 65 && g > 35 && b > 20 &&
              r > g && r > b &&
              (r - g) > 12 &&
              Math.abs(r - g) < 130 &&
              r < 252
            );
          }

          function startTiltLoop() {
            if (rafId) cancelAnimationFrame(rafId);
            const vid = document.getElementById("tsVideo");
            const canvas = document.getElementById("tsCanvas");
            const tracker = document.getElementById("tsTracker");
            const readout = document.getElementById("tsTiltReadout");
            const zLeft = document.getElementById("zoneLeft");
            const zRight = document.getElementById("zoneRight");
            if (!vid || !canvas) return;

            const ctx = canvas.getContext("2d", { willReadFrequently: true });
            const tctx = tracker ? tracker.getContext("2d") : null;
            const w = canvas.width;
            const h = canvas.height;

            const tick = () => {
              if (!tiltEnabled) return;
              if (vid.readyState >= 2 && vid.videoWidth > 0) {
                ctx.save();
                ctx.translate(w, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(vid, 0, 0, w, h);
                ctx.restore();

                const frame = ctx.getImageData(0, 0, w, h);
                const data = frame.data;

                let topSumX = 0, topCount = 0;
                let botSumX = 0, botCount = 0;
                let motionSumX = 0, motionTopX = 0, motionBotX = 0, motionCount = 0, motionTopCount = 0, motionBotCount = 0;

                const topYStart = Math.floor(h * 0.10);
                const topYEnd = Math.floor(h * 0.45);
                const botYStart = Math.floor(h * 0.45);
                const botYEnd = Math.floor(h * 0.80);

                for (let y = topYStart; y < botYEnd; y += 2) {
                  for (let x = 8; x < w - 8; x += 2) {
                    const idxP = (y * w + x) * 4;
                    const r = data[idxP], g = data[idxP + 1], b = data[idxP + 2];

                    let diff = 0;
                    if (prevFrame) {
                      const pr = prevFrame[idxP], pg = prevFrame[idxP + 1], pb = prevFrame[idxP + 2];
                      diff = (Math.abs(r - pr) + Math.abs(g - pg) + Math.abs(b - pb)) / 3;
                    }

                    if (diff > 18) {
                      motionSumX += x;
                      motionCount += 1;
                      if (y < topYEnd) {
                        motionTopX += x;
                        motionTopCount += 1;
                      } else {
                        motionBotX += x;
                        motionBotCount += 1;
                      }
                    }

                    if (isSkinLike(r, g, b)) {
                      if (y < topYEnd) {
                        topSumX += x;
                        topCount += 1;
                      } else {
                        botSumX += x;
                        botCount += 1;
                      }
                    }
                  }
                }
                prevFrame = new Uint8ClampedArray(data);

                let rawDeg = 0;
                let headX = w / 2;
                let headY = h * 0.42;

                if (topCount > 25 && botCount > 25) {
                  const topAvgX = topSumX / topCount;
                  const botAvgX = botSumX / botCount;
                  const horizShift = (topAvgX - botAvgX) / (w * 0.22);
                  rawDeg = Math.max(-40, Math.min(40, horizShift * 26));
                  headX = (topAvgX + botAvgX) / 2;
                  headY = ((topYStart + topYEnd) / 2 + (botYStart + botYEnd) / 2) / 2;
                } else if (motionCount > 30) {
                  const mAvgX = motionSumX / motionCount;
                  const offsetNorm = (mAvgX - w / 2) / (w * 0.35);
                  const topBotShift = (motionTopCount > 8 && motionBotCount > 8)
                    ? ((motionTopX / motionTopCount) - (motionBotX / motionBotCount)) / (w * 0.18)
                    : 0;
                  rawDeg = Math.max(-40, Math.min(40, (offsetNorm * 0.55 + topBotShift * 0.45) * 32));
                  headX = mAvgX;
                }

                smoothedDeg = smoothedDeg * 0.72 + rawDeg * 0.28;
                const degRounded = Math.round(smoothedDeg);

                if (readout) {
                  if (degRounded <= -14) readout.textContent = `Tilt: LEFT ${degRounded}° (Past)`;
                  else if (degRounded >= 14) readout.textContent = `Tilt: RIGHT +${degRounded}° (Present)`;
                  else readout.textContent = `Tilt: ${degRounded > 0 ? "+" : ""}${degRounded}°`;
                }

                if (zLeft) zLeft.classList.toggle("active-left", degRounded <= -14);
                if (zRight) zRight.classList.toggle("active-right", degRounded >= 14);

                if (tctx && tracker) {
                  tctx.clearRect(0, 0, tracker.width, tracker.height);
                  const drawX = (headX / w) * tracker.width;
                  const drawY = (headY / h) * tracker.height;
                  const rad = (degRounded * Math.PI) / 180;

                  tctx.save();
                  tctx.translate(drawX, drawY);
                  tctx.rotate(rad);
                  tctx.strokeStyle = degRounded <= -14 ? "#fbbf24" : (degRounded >= 14 ? "#22d3ee" : "rgba(255,255,255,0.65)");
                  tctx.lineWidth = 3;
                  tctx.beginPath();
                  tctx.ellipse(0, 0, 26, 34, 0, 0, Math.PI * 2);
                  tctx.stroke();

                  tctx.beginPath();
                  tctx.moveTo(-34, 0);
                  tctx.lineTo(34, 0);
                  tctx.stroke();
                  tctx.restore();
                }

                if (!answered && !finished && Date.now() > tiltLockCooldown) {
                  if (degRounded <= -15) {
                    submitAnswer("past");
                  } else if (degRounded >= 15) {
                    submitAnswer("present");
                  }
                }
              }
              rafId = requestAnimationFrame(tick);
            };
            rafId = requestAnimationFrame(tick);
          }

          const camBtn = document.getElementById("tsCamBtn");
          if (camBtn) {
            camBtn.addEventListener("click", () => {
              if (tiltEnabled) {
                stopCamera();
                camBtn.textContent = "📷 Enable Camera Tilt";
              } else {
                enableCamera().then(() => {
                  if (tiltEnabled) camBtn.textContent = "📷 Stop Camera Tilt";
                });
              }
            });
          }

          activeCameraCleanup = () => {
            window.removeEventListener("keydown", keyHandler);
            stopCamera();
          };
        }

        draw();
      }

      function route() {
        runCleanup();
        const mount = document.getElementById("viewMount");
        const h = window.location.hash || "#/";
        if (h === "#/buddy-translate") renderBuddyTranslateView(mount);
        else if (h === "#/dictionary") renderDictionaryView(mount);
        else if (h === "#/tense-converter") renderTenseConverterView(mount);
        else if (h === "#/buddy-checker") renderBuddyCheckerView(mount);
        else if (h === "#/burger-madness") renderBurgerMadnessView(mount);
        else if (h === "#/tense-showdown") renderTenseShowdownView(mount);
        else renderHomeView(mount);
      }

      window.addEventListener("hashchange", route);
      route();
    })();
  </script>
</body>
